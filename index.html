function buildWeeklyGoals(s) {
  const days = weekDays();
  const workoutsWeek = (s.workouts || []).filter(w => days.includes(w.date)).length;
  const activeDays = days.filter(d => (s.xpByDate[d] || 0) > 0).length;
  const xpWeek = days.reduce((a, d) => a + (s.xpByDate[d] || 0), 0);
  return [
    { id: "wk_train", t: "Treine 4 vezes", icon: Dumbbell, cur: workoutsWeek, tgt: 4, xp: 80 },
    { id: "wk_active", t: "Fique ativo 5 dias", icon: Flame, cur: activeDays, tgt: 5, xp: 60 },

function levelInfo(xp) {
  let level = 1, acc = 0, need = 200;
  while (xp >= acc + need && level < 100) { acc += need; level++; need = 200 + (level - 1) * 100; }
  return { level, current: xp - acc, need, pct: Math.min(100, ((xp - acc) / need) * 100) };
}

function MetasTab({ s, update, award, fireToast }) {
  const t = today();
  const wk = weekKey();
  const diaDone = (s.metasDia && s.metasDia.date === t) ? s.metasDia.ids : [];
  const semDone = (s.metasSemana && s.metasSemana.week === wk) ? s.metasSemana.ids : [];
  const bonusDone = (s.metasSemana && s.metasSemana.week === wk && s.metasSemana.bonus) ? s.metasSemana.bonus : [];
  const proprias = s.metasProprias || [];
  const extras = (s.metasExtras && s.metasExtras.date === t) ? s.metasExtras.itens : [];

  const [novoExtra, setNovoExtra] = useState("");
  const [novaMeta, setNovaMeta] = useState("");
  const [novaArea, setNovaArea] = useState("Disciplina");
  const [abrirCriar, setAbrirCriar] = useState(false);

  const totalSem = META_AREAS.reduce((n, a) => n + a.goals.length, 0) + proprias.length;
  const feitasSem = semDone.length;
  const pctSem = totalSem ? Math.round(feitasSem / totalSem * 100) : 0;

  const FRASES = [
    "Tudo posso naquele que me fortalece. — Filipenses 4:13",
    "A disciplina é a ponte entre metas e conquistas.",
    "Um dia de cada vez. Deus cuida do resto.",
    "O impossível dos homens não é o impossível de Deus.",
    "Constância vence talento.",
    "Pequenos passos todos os dias constroem grandes vitórias.",
    "A fé move, a disciplina constrói.",
    "Confie no Senhor e faça a sua parte.",
  ];
  const frase = FRASES[new Date().getDate() % FRASES.length];

  const marcarDia = (id, xp) => {
    if (diaDone.includes(id)) return;
    update(p => { const cur = (p.metasDia && p.metasDia.date === t) ? p.metasDia.ids : []; return { ...p, metasDia: { date: t, ids: [...cur, id] } }; });
    award(xp);
  };

  const marcarSem = (id, xp, area) => {
    if (semDone.includes(id)) return;
    const areaObj = META_AREAS.find(a => a.area === area);
    const completa = areaObj && !bonusDone.includes(area) && areaObj.goals.every(g => g.id === id || semDone.includes(g.id));
    update(p => {
      const same = p.metasSemana && p.metasSemana.week === wk;
      const cur = same ? p.metasSemana.ids : [];
      const curB = same && p.metasSemana.bonus ? p.metasSemana.bonus : [];
      const extra = completa ? 50 : 0;
      return { ...p, metasSemana: { week: wk, ids: [...cur, id], bonus: completa ? [...curB, area] : curB }, xp: p.xp + extra, xpByDate: extra ? { ...p.xpByDate, [t]: (p.xpByDate[t] || 0) + extra } : p.xpByDate };
    });
    award(xp);
    if (completa && fireToast) fireToast(`🏆 Você fechou a área ${area}`);
  };

  const addExtra = () => {
    const txt = novoExtra.trim();
    if (!txt) return;
    const item = { id: "e" + Date.now(), t: txt, feito: false };
    update(p => { const cur = (p.metasExtras && p.metasExtras.date === t) ? p.metasExtras.itens : []; return { ...p, metasExtras: { date: t, itens: [...cur, item] } }; });
    setNovoExtra("");
  };

  const alternarExtra = (id) => {
    let virouFeito = false;
    update(p => {
      const cur = (p.metasExtras && p.metasExtras.date === t) ? p.metasExtras.itens : [];
      const novos = cur.map(x => { if (x.id !== id) return x; if (!x.feito) virouFeito = true; return { ...x, feito: !x.feito }; });
      return { ...p, metasExtras: { date: t, itens: novos } };
    });
    if (virouFeito) award(10);
  };

  const removerExtra = (id) => {
    update(p => { const cur = (p.metasExtras && p.metasExtras.date === t) ? p.metasExtras.itens : []; return { ...p, metasExtras: { date: t, itens: cur.filter(x => x.id !== id) } }; });
  };

  const criarMeta = () => {
    const txt = novaMeta.trim();
    if (!txt) return;
    const nova = { id: "pr" + Date.now(), t: txt, area: novaArea, xp: 25 };
    update(p => ({ ...p, metasProprias: [...(p.metasProprias || []), nova] }));
    setNovaMeta("");
    setAbrirCriar(false);
    if (fireToast) fireToast("Meta criada.");
  };

  const removerMeta = (id) => {
    update(p => ({ ...p, metasProprias: (p.metasProprias || []).filter(x => x.id !== id) }));
  };

  const Caixinha = ({ on, size = 20 }) => (
    <div style={{ width: size, height: size, borderRadius: "50%", border: `1.5px solid ${on ? C.gold : C.muted}`, background: on ? C.gold : "transparent", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
      {on ? <Check size={size - 7} style={{ color: "#000" }} /> : null}
    </div>
  );

  return (
    <div className="px-5 pt-6 pb-28" style={{ maxWidth: 440, margin: "0 auto" }}>
      <h1 className="text-2xl font-bold mb-1">Metas</h1>
      <p className="text-sm mb-4" style={{ color: C.muted }}>Evolua em todas as áreas da sua vida.</p>

      <div className="rounded-2xl p-4 mb-3" style={{ background: C.card, border: `1px solid ${C.border}` }}>
        <div className="flex items-center justify-between mb-2">
          <p className="text-xs font-bold" style={{ color: C.muted, letterSpacing: ".1em" }}>PROGRESSO DA SEMANA</p>
          <span className="text-sm font-bold" style={{ color: C.gold }}>{feitasSem}/{totalSem}</span>
        </div>
        <div className="h-2.5 rounded-full overflow-hidden" style={{ background: C.cardL }}>
          <div className="h-full rounded-full" style={{ width: `${pctSem}%`, background: `linear-gradient(90deg, #EBCB6E, ${C.gold})`, transition: "width .4s" }} />
        </div>
      </div>
      <p className="text-sm italic text-center mb-6" style={{ color: C.gold }}>“{frase}”</p>

      {/* ---------- O QUE EU VOU FAZER HOJE ---------- */}
      <div className="rounded-2xl p-4 mb-4" style={{ background: C.card, border: `1px solid ${C.border}` }}>
        <div className="flex items-center justify-between mb-3">
          <p className="font-bold flex items-center gap-2"><Target size={17} style={{ color: C.gold }} /> Meus objetivos de hoje</p>
          <span className="text-xs font-bold" style={{ color: C.gold }}>{extras.filter(x => x.feito).length}/{extras.length}</span>
        </div>
        <div className="flex gap-2 mb-3">
          <input value={novoExtra} onChange={e => setNovoExtra(e.target.value)} onKeyDown={e => { if (e.key === "Enter") addExtra(); }} placeholder="Ex: gravar 2 vídeos de treino" className="flex-1 rounded-xl px-3 py-2.5 text-sm outline-none" style={{ background: C.cardL, color: C.white, border: "none", minWidth: 0 }} />
          <button onClick={addExtra} className="rounded-xl px-3 flex items-center justify-center" style={{ background: C.gold, color: "#000", border: "none", cursor: "pointer" }}><Plus size={17} /></button>
        </div>
        {extras.length === 0 ? (
          <p className="text-xs" style={{ color: C.muted }}>Escreva aqui as coisas que só valem para hoje.</p>
        ) : (
          <div className="flex flex-col gap-2">
            {extras.map(x => (
              <div key={x.id} className="flex items-center gap-3 rounded-xl px-3 py-2.5" style={{ background: x.feito ? "rgba(212,175,55,0.12)" : C.cardL, border: `1px solid ${x.feito ? C.gold : "transparent"}` }}>
                <button onClick={() => alternarExtra(x.id)} style={{ background: "none", border: "none", padding: 0, cursor: "pointer" }}><Caixinha on={x.feito} /></button>
                <span className="text-sm flex-1" style={{ color: x.feito ? C.muted : C.white, textDecoration: x.feito ? "line-through" : "none" }}>{x.t}</span>
                <button onClick={() => removerExtra(x.id)} style={{ background: "none", border: "none", cursor: "pointer", padding: 2 }}><X size={14} style={{ color: C.muted }} /></button>
              </div>
            ))}
          </div>
        )}
      </div>

      {/* ---------- META DO DIA ---------- */}
      <div className="rounded-2xl p-4 mb-4" style={{ background: `linear-gradient(180deg, rgba(212,175,55,0.10), ${C.card})`, border: `1px solid ${C.gold}` }}>
        <div className="flex items-center justify-between mb-3">
          <p className="font-bold flex items-center gap-2"><Sparkles size={17} style={{ color: C.gold }} /> Meta do dia</p>
          <span className="text-xs font-bold" style={{ color: C.gold }}>{diaDone.length}/{META_DIA.length}</span>
        </div>
        <div className="flex flex-col gap-2">
          {META_DIA.map(g => {
            const done = diaDone.includes(g.id);
            return (
              <button key={g.id} onClick={() => marcarDia(g.id, g.xp)} className="flex items-center gap-3 rounded-xl px-3 py-2.5 text-left" style={{ background: done ? "rgba(212,175,55,0.12)" : C.cardL, border: `1px solid ${done ? C.gold : "transparent"}`, cursor: "pointer" }}>
                <Caixinha on={done} size={22} />
                <g.icon size={16} style={{ color: C.gold }} />
                <span className="text-sm flex-1" style={{ color: done ? C.muted : C.white, textDecoration: done ? "line-through" : "none" }}>{g.t}</span>
              </button>
            );
          })}
        </div>
      </div>

      {/* ---------- MINHAS PRÓPRIAS METAS ---------- */}
      <div className="rounded-2xl p-4 mb-6" style={{ background: C.card, border: `1px solid ${C.border}` }}>
        <div className="flex items-center justify-between mb-3">

        </div>

        {proprias.length === 0 && !abrirCriar ? (
          <p className="text-xs mb-3" style={{ color: C.muted }}>Crie metas com as suas palavras. Elas renovam toda semana, junto com as outras.</p>

        {proprias.length > 0 ? (
          <div className="flex flex-col gap-2.5 mb-3">
            {proprias.map(g => {
              const done = semDone.includes(g.id);
              return (
                <div key={g.id} className="flex items-center gap-3">

function VivonApp() {
  const [s, setS] = useState(null);
  const [toast, setToast] = useState("");
  const [access, setAccess] = useState(() => {
    if (!EXIGIR_SENHA) return true;
    try {
      if (localStorage.getItem("vivon-access") === "1") return true;
      const p = new URLSearchParams(window.location.search).get("s");
      if (p && ACCESS_PASSWORDS.map(x => x.toUpperCase()).includes(p.trim().toUpperCase())) {
        localStorage.setItem("vivon-access", "1");
        try { window.history.replaceState({}, "", window.location.pathname); } catch (e) {}
        return true;
      }
      return false;
    } catch (e) { return false; }
  });
  const loaded = useRef(false);
  const toastTimer = useRef(null);

  useEffect(() => {
    try {
      const raw = localStorage.getItem("vivon-state");
      setS(raw ? { ...DEFAULT, ...JSON.parse(raw) } : DEFAULT);
    } catch { setS(DEFAULT); }
    loaded.current = true;
  }, []);

  useEffect(() => {
    if (!s || !loaded.current) return;
    try { localStorage.setItem("vivon-state", JSON.stringify(s)); } catch {}
  }, [s]);

  useEffect(() => {
    if (!s || s.screen !== "app" || !s.notif || !s.notif.on) return;
    if (typeof Notification === "undefined" || Notification.permission !== "granted") return;
    const t = today();
    if (s.notif.last === t) return;
    const atRisk = s.lastActive !== t && s.streak > 0;
    if (atRisk && new Date().getHours() >= 17) {
      try {
        new Notification("🔥 Não perca sua sequência!", { body: `Você está há ${s.streak} dias seguidos. Registre algo hoje pra manter o ritmo.`, icon: "/icon-192.png" });
        setS(p => ({ ...p, notif: { ...(p.notif || {}), last: t } }));
      } catch (e) {}
    }
  }, [s]);

  function fireToast(msg) {
    setToast(msg);
    clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(""), 2600);
  }

  if (!s) return <Splash />;
  if (!access) return <AccessGate onUnlock={() => setAccess(true)} />;

  const award = (amount) => {
    try { if (navigator.vibrate) navigator.vibrate(18); } catch (e) {}
    playDing(false);
    setS(p => {
      const t = today(), y = yesterday();
      let streak = p.streak, last = p.lastActive, voltas = p.voltas || 0, melhor = p.melhorSeq || 0, aviso = p.avisoVolta || "";
      if (last !== t) {
        if (last && last !== y) { voltas = voltas + 1; aviso = t; streak = 1; }
        else { streak = last === y ? streak + 1 : 1; }
        last = t;
      }
      if (streak > melhor) melhor = streak;
      return { ...p, xp: p.xp + amount, lastActive: last, streak, voltas, melhorSeq: melhor, avisoVolta: aviso, xpByDate: { ...p.xpByDate, [t]: (p.xpByDate[t] || 0) + amount } };
    });
  };
  const update = (patch) => setS(p => ({ ...p, ...(typeof patch === "function" ? patch(p) : patch) }));

  if (s.screen === "onboarding") return <Onboarding s={s} update={update} award={award} />;

  return (
    <div style={{ background: C.bg, color: C.white, minHeight: "100vh" }} className="w-full">
      <GlobalAnim />
      <div className="mx-auto flex flex-col" style={{ maxWidth: 440, minHeight: "100vh" }}>
        {toast && (
          <div className="fixed left-1/2 z-50 px-4 py-2.5 rounded-xl text-sm font-semibold" style={{ top: 16, transform: "translateX(-50%)", background: C.gold, color: "#000", boxShadow: "0 8px 30px rgba(212,175,55,0.4)" }}>{toast}</div>
        )}
        <TopBar s={s} update={update} />
        <div className="flex-1 overflow-y-auto pb-24">
          {(s.tab === "hoje" || s.tab === "home" || s.tab === "track") && <HojeTab s={s} update={update} award={award} fireToast={fireToast} />}
          {s.tab === "treinos" && <TreinosTab update={update} award={award} fireToast={fireToast} />}
          {s.tab === "dash" && <DashboardTab s={s} setS={setS} />}
          {s.tab === "ai" && <AITab s={s} setS={setS} award={award} />}
          {s.tab === "profile" && <ProfileTab s={s} update={update} award={award} fireToast={fireToast} />}
          {s.tab === "metas" && <MetasTab s={s} update={update} award={award} fireToast={fireToast} />}
        </div>
        <Nav tab={s.tab} setTab={(t) => update({ tab: t })} />
      </div>
    </div>
  );
}

function GuidedWorkout({ group, onClose, onFinish }) {
  const exs = group.exercises;
  const [idx, setIdx] = useState(0);
  const [phase, setPhase] = useState("exercise");
  const [rest, setRest] = useState(60);

  const next = () => { setIdx(i => i + 1); setRest(60); setPhase("exercise"); };

  useEffect(() => {
    if (phase !== "rest") return;
    if (rest <= 0) { next(); return; }
    const id = setTimeout(() => setRest(r => r - 1), 1000);
    return () => clearTimeout(id);
  }, [phase, rest]);

  const startRest = () => { if (idx >= exs.length - 1) { setPhase("done"); } else { setRest(60); setPhase("rest"); } };
  const finish = () => { onFinish(group.group); onClose(); };
  const ex = exs[idx];

  return (
    <div style={{ position: "fixed", inset: 0, zIndex: 60, background: C.bg, display: "flex", flexDirection: "column" }}>
      <div className="flex items-center justify-between px-5 pt-5">
        <span className="text-sm font-semibold" style={{ color: C.muted }}>{group.group} · {Math.min(idx + 1, exs.length)}/{exs.length}</span>
        <button onClick={onClose} style={{ background: "none", border: "none", cursor: "pointer" }}><X size={24} style={{ color: C.muted }} /></button>
      </div>
      <div className="h-1 mx-5 mt-3 rounded-full overflow-hidden" style={{ background: C.cardL }}>
        <div className="h-full rounded-full" style={{ width: `${(idx / exs.length) * 100}%`, background: C.gold, transition: "width .3s" }} />
      </div>

      {phase === "exercise" ? (
        <div className="flex-1 flex flex-col items-center justify-center px-6 text-center">
          <p className="text-xs font-bold mb-3" style={{ color: C.gold, letterSpacing: ".15em" }}>EXERCÍCIO {idx + 1}</p>
          <h2 className="text-3xl font-bold mb-3">{ex.name}</h2>
          <p className="text-xl" style={{ color: C.gold }}>{ex.sets}</p>
        </div>
      ) : phase === "rest" ? (
        <div className="flex-1 flex flex-col items-center justify-center px-6 text-center">
          <p className="text-xs font-bold mb-4" style={{ color: C.muted, letterSpacing: ".15em" }}>DESCANSO</p>
          <div className="font-bold mb-3" style={{ color: C.gold, fontSize: 76, lineHeight: 1 }}>{rest}s</div>
          <p className="text-sm mb-1" style={{ color: C.muted }}>Próximo</p>
          <p className="text-lg font-semibold">{exs[idx + 1]?.name}</p>
        </div>
      ) : (
        <div className="flex-1 flex flex-col items-center justify-center px-6 text-center">
          <Trophy size={56} style={{ color: C.gold }} />
          <h2 className="text-2xl font-bold mt-4 mb-2">Treino concluído!</h2>
          <p className="text-sm" style={{ color: C.muted }}>Você completou {exs.length} exercícios de {group.group}.</p>
        </div>
      )}

      <div className="px-5 pb-8 space-y-3">
        {phase === "exercise" ? (
          <Btn onClick={startRest}>{idx >= exs.length - 1 ? "Finalizar treino" : "Concluí · descansar"} <Check size={18} /></Btn>
        ) : phase === "rest" ? (
          <div className="space-y-3">
            <Btn onClick={next}>Pular descanso <ChevronRight size={18} /></Btn>
            <button onClick={() => setRest(r => r + 15)} className="w-full rounded-2xl py-3 font-semibold" style={{ background: C.card, color: C.gold, border: `1px solid ${C.border}`, cursor: "pointer" }}>+15s</button>
          </div>
        ) : (
          <Btn onClick={finish}>Concluir <Check size={18} /></Btn>
        )}
      </div>
    </div>
  );
}

function AITab({ s, setS, award }) {
  const [mode, setMode] = useState("coach");
  const [input, setInput] = useState("");
  const [loading, setLoading] = useState(false);
  const scroller = useRef(null);
  const msgs = s.chats[mode] || [];
  const M = MODES[mode];
  useEffect(() => { if (scroller.current) scroller.current.scrollTop = scroller.current.scrollHeight; }, [msgs, loading]);

  const ctx = () => {
    const p = s.profile;
    const g = GOALS.find(x => x.k === p.goal)?.t || "—";
    const l = LEVELS.find(x => x.k === p.level)?.t || "—";
    const recent = s.workouts.slice(0, 3).map(w => w.name).join(", ") || "nenhum";
    return `Contexto real do usuário (use para personalizar): nome ${p.name || "—"}, objetivo ${g}, nível de treino ${l}, idade ${p.age || "—"}, peso atual ${currentWeight(s) ?? "—"}kg, peso inicial ${startWeight(s) ?? "—"}kg, sequência ${s.streak} dias, está voltando de "${(VOLTANDO.find(v => v.k === p.voltando) || {}).t || "—"}", já voltou ${s.voltas || 0} vezes depois de parar, score hoje ${vivonScore(s)}/100, treinos recentes: ${recent}, hábitos hoje ${habitsDoneToday(s)}/6. Responda em português do Brasil, objetivo e premium.`;
  };

  const send = async (preset) => {
    const text = (preset ?? input).trim();
    if (!text || loading) return;
    const history = [...msgs, { role: "user", content: text }];
    setS(p => ({ ...p, chats: { ...p.chats, [mode]: history }, aiLog: { date: today(), count: (p.aiLog?.date === today() ? p.aiLog.count : 0) + 1 } }));
    setInput(""); setLoading(true); award(5);
    try {
      const res = await fetch(AI_ENDPOINT, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ max_tokens: 1000, system: `${M.sys} ${ctx()}`, messages: history.map(m => ({ role: m.role, content: m.content })) }) });
      const data = await res.json();
      const reply = (data.content || []).filter(b => b.type === "text").map(b => b.text).join("\n").trim() || "Não consegui responder agora. Tenta de novo?";
      setS(p => ({ ...p, chats: { ...p.chats, [mode]: [...history, { role: "assistant", content: reply }] } }));
    } catch { setS(p => ({ ...p, chats: { ...p.chats, [mode]: [...history, { role: "assistant", content: "Não consegui conectar com a IA. (Configure a função vivon-ai e a chave no Netlify.)" }] } })); }
    finally { setLoading(false); }
  };

  return (
    <div className="flex flex-col" style={{ height: "calc(100vh - 80px)" }}>
      <div className="px-5 pt-6 pb-3">
        <div className="flex items-center gap-2 mb-4"><Brain size={22} style={{ color: C.gold }} /><h1 className="text-xl font-bold">VIVON AI</h1></div>

          <div className="flex flex-col gap-2">{M.chips.map(c => <button key={c} onClick={() => send(c)} className="text-left rounded-xl px-3.5 py-2.5 text-sm flex items-center justify-between" style={{ background: C.cardL, color: "#D8D8D8" }}>{c}<ChevronRight size={15} style={{ color: C.gold }} /></button>)}</div>
        </>)}
        {msgs.map((m, i) => (<div key={i} className={`flex ${m.role === "user" ? "justify-end" : "justify-start"}`}><div className="max-w-[85%] rounded-2xl px-4 py-2.5 text-sm leading-relaxed whitespace-pre-wrap" style={m.role === "user" ? { background: C.gold, color: "#000", borderBottomRightRadius: 4 } : { background: C.card, color: C.white, border: `1px solid ${C.border}`, borderBottomLeftRadius: 4 }}>{m.content}</div></div>))}
        {loading && <div className="flex justify-start"><div className="rounded-2xl px-4 py-3" style={{ background: C.card, border: `1px solid ${C.border}` }}><Loader2 size={18} className="animate-spin" style={{ color: C.gold }} /></div></div>}
      </div>
      <div className="px-4 py-3 flex items-center gap-2" style={{ borderTop: `1px solid ${C.border}` }}>
        <input value={input} onChange={e => setInput(e.target.value)} onKeyDown={e => e.key === "Enter" && send()} placeholder={`Fale com o ${M.short}...`} className="flex-1 rounded-full px-4 py-3 text-sm outline-none" style={{ background: C.card, color: C.white, border: `1px solid ${C.border}` }} />
        <button onClick={() => send()} disabled={loading || !input.trim()} className="rounded-full p-3 flex-shrink-0" style={{ background: input.trim() && !loading ? C.gold : C.cardL, color: "#000" }}><Send size={18} /></button>
      </div>
    </div>
  );
}

function TrackTab({ s, update, award, fireToast }) {
  const t = today();
  const water = waterToday(s);
  const habitsDone = s.habits.date === t ? s.habits.done : {};
  const sleepH = sleepToday(s);
  const md = moodToday(s);
  const pend = pendentesHoje(s);
  const score = vivonScore(s);
  const [wName, setWName] = useState(""); const [wMin, setWMin] = useState("");
  const [meal, setMeal] = useState(""); const [weight, setWeight] = useState("");

  const setWater = (n) => update(() => ({ water: { date: t, count: Math.max(0, n) } }));
  const addWater = () => { setWater(water + 1); award(10); };
  const setSleep = (h) => update(() => ({ sleep: { date: t, hours: Math.max(0, Math.min(14, h)) } }));
  const toggleHabit = (k) => { const cur = s.habits.date === t ? s.habits.done : {}; const on = !cur[k]; update({ habits: { date: t, done: { ...cur, [k]: on } } }); if (on) award(15); };
  const logWorkout = () => { if (!wName.trim()) return; update(p => ({ workouts: [{ id: Date.now(), date: t, name: wName.trim(), min: wMin }, ...p.workouts] })); setWName(""); setWMin(""); award(50); };
  const logMeal = () => { if (!meal.trim()) return; update(p => ({ meals: [{ id: Date.now(), date: t, desc: meal.trim() }, ...p.meals] })); setMeal(""); award(20); };
  const logWeight = () => { if (!weight) return; update(p => ({ weights: [{ id: Date.now(), date: t, val: parseFloat(weight) }, ...p.weights] })); setWeight(""); award(10); };
  const delWorkout = (id) => update(p => ({ workouts: p.workouts.filter(w => w.id !== id) }));
  const delMeal = (id) => update(p => ({ meals: p.meals.filter(m => m.id !== id) }));
  const delWeight = (id) => update(p => ({ weights: p.weights.filter(w => w.id !== id) }));

  const setMood = (campo, valor) => {
    const antes = md || { date: t, humor: 0, energia: 0 };
    const novo = { ...antes, date: t, [campo]: valor };
    const primeiraVez = !md;
    update(p => ({ ...p, mood: novo, moodByDate: { ...(p.moodByDate || {}), [t]: { humor: novo.humor, energia: novo.energia } } }));
    if (primeiraVez) award(10);
  };

  const lastWeight = s.weights[0];
  const todayWorkouts = s.workouts.filter(w => w.date === t);
  const todayMeals = s.meals.filter(m => m.date === t);
  const todayWeights = s.weights.filter(w => w.date === t);

  const diarioHoje = (s.diario && s.diario[t]) ? s.diario[t] : "";
  const [verHistorico, setVerHistorico] = useState(false);
  const diasComTexto = Object.keys(s.diario || {}).filter(d => d !== t && (s.diario[d] || "").trim()).sort().reverse().slice(0, 14);

  const escreverDiario = (txt) => {
    let ganhou = false;
    update(p => {
      const pago = p.diarioXp || [];
      const merece = txt.trim().length >= 20 && !pago.includes(t);
      if (merece) ganhou = true;
      return { ...p, diario: { ...(p.diario || {}), [t]: txt }, diarioXp: merece ? [...pago, t] : pago };
    });
    if (ganhou) { award(15); if (fireToast) fireToast("📝 Dia registrado"); }
  };

  const CARINHAS = ["😞", "😕", "😐", "🙂", "😄"];
  const RAIOS = ["🪫", "🔅", "🔆", "⚡", "🚀"];

  const Escala = ({ opcoes, valor, onPick }) => (
    <div className="flex gap-2">
      {opcoes.map((emoji, i) => {
        const n = i + 1;
        const sel = valor === n;
        return (
          <button key={n} onClick={() => onPick(n)} className="flex-1 rounded-xl py-2.5 flex items-center justify-center"
            style={{ background: sel ? "rgba(212,175,55,0.16)" : C.cardL, border: `1.5px solid ${sel ? C.gold : "transparent"}`, fontSize: 22, cursor: "pointer", opacity: sel || !valor ? 1 : 0.45, transition: "all .15s" }}>
            {emoji}
          </button>
        );
      })}
    </div>
  );

  const LinhaRegistro = ({ children, onDel }) => (
    <div className="flex items-center gap-2 py-1.5">
      <div className="flex-1 min-w-0">{children}</div>
      <button onClick={onDel} aria-label="Apagar" style={{ background: "none", border: "none", cursor: "pointer", padding: 2, flexShrink: 0 }}><X size={14} style={{ color: C.muted }} /></button>
    </div>
  );

  return (
    <div className="px-5 pt-6 space-y-4">
      <h1 className="text-xl font-bold flex items-center gap-2"><Zap size={20} style={{ color: C.gold }} />Evoluir hoje</h1>

      {/* Fechar o dia */}
      <Card style={{ background: "linear-gradient(135deg, rgba(212,175,55,0.10), rgba(20,20,20,1))" }}>
        <div className="flex items-center justify-between mb-3">
          <span className="font-bold flex items-center gap-2"><Target size={17} style={{ color: C.gold }} />Fechar o dia</span>
          <span className="text-sm font-bold" style={{ color: C.gold }}>{score}/100</span>
        </div>
        <div className="h-2 rounded-full overflow-hidden mb-3" style={{ background: C.cardL }}>
          <div className="h-full rounded-full" style={{ width: `${score}%`, background: `linear-gradient(90deg, #EBCB6E, ${C.gold})`, transition: "width .4s" }} />
        </div>
        {pend.length === 0 ? (
          <p className="text-sm font-semibold" style={{ color: C.gold }}>🏆 Dia fechado. Você pontuou tudo hoje.</p>
        ) : (
          <div className="flex flex-col gap-1.5">
            <p className="text-xs font-bold mb-1" style={{ color: C.muted, letterSpacing: ".08em" }}>AINDA DÁ PRA PONTUAR</p>
            {pend.map((p, i) => (
              <div key={i} className="flex items-center justify-between rounded-lg px-3 py-2" style={{ background: C.cardL }}>
                <span className="text-sm" style={{ color: "#CFCFCF" }}>{p.t}</span>
                <span className="text-xs font-bold" style={{ color: C.gold }}>+{p.pts}</span>
              </div>
            ))}
          </div>
        )}
      </Card>

      {/* Humor e energia */}
      <Section title="Como você está hoje" icon={Activity} right={md ? <Check size={16} style={{ color: C.gold }} /> : <span className="text-xs" style={{ color: C.muted }}>toque pra marcar</span>}>
        <p className="text-xs mb-2" style={{ color: C.muted }}>Humor</p>
        <Escala opcoes={CARINHAS} valor={md ? md.humor : 0} onPick={v => setMood("humor", v)} />
        <p className="text-xs mb-2 mt-4" style={{ color: C.muted }}>Energia</p>
        <Escala opcoes={RAIOS} valor={md ? md.energia : 0} onPick={v => setMood("energia", v)} />
        <p className="text-[11px] mt-3" style={{ color: C.muted }}>Com o tempo isso vira um gráfico no Painel — você começa a ver o que te derruba e o que te levanta.</p>
      </Section>

      <Section title="Hidratação" icon={Droplet} right={<span className="text-xs font-bold" style={{ color: water >= 8 ? C.gold : C.muted }}>{water}/8</span>}>
        <div className="flex items-center justify-between">
          <div className="flex items-center gap-1">{Array.from({ length: 8 }).map((_, i) => <Droplet key={i} size={20} style={{ color: i < water ? C.gold : C.cardL }} fill={i < water ? C.gold : "none"} />)}</div>
          <div className="flex items-center gap-2"><RoundBtn onClick={() => setWater(water - 1)}><Minus size={16} /></RoundBtn><RoundBtn gold onClick={addWater}><Plus size={16} /></RoundBtn></div>
        </div>
        {water > 8 ? <p className="text-xs mt-2 font-semibold" style={{ color: C.gold }}>+{water - 8} além da meta. Excelente.</p> : null}
      </Section>

      <Section title="Sono" icon={Bed} right={<span className="font-bold" style={{ color: C.gold }}>{sleepH}h</span>}><div className="flex items-center gap-2"><RoundBtn onClick={() => setSleep(sleepH - 0.5)}><Minus size={16} /></RoundBtn><div className="flex-1 h-2 rounded-full overflow-hidden" style={{ background: C.cardL }}><div className="h-full rounded-full" style={{ width: `${Math.min(100, (sleepH / 8) * 100)}%`, background: C.gold }} /></div><RoundBtn gold onClick={() => setSleep(sleepH + 0.5)}><Plus size={16} /></RoundBtn></div><p className="text-xs mt-2" style={{ color: C.muted }}>Meta: 8 horas</p></Section>

      <Section title="Hábitos do dia" icon={Check} right={<span className="text-xs font-bold" style={{ color: C.gold }}>{habitsDoneToday(s)}/{HABITS.length}</span>}><div className="grid grid-cols-2 gap-2">{HABITS.map(h => { const on = habitsDone[h.k]; return (<button key={h.k} onClick={() => toggleHabit(h.k)} className="flex items-center gap-2 rounded-xl px-3 py-2.5 text-sm transition" style={{ background: on ? "rgba(212,175,55,0.12)" : C.cardL, border: `1px solid ${on ? C.gold : "transparent"}` }}><h.icon size={16} style={{ color: on ? C.gold : C.muted }} /><span style={{ color: on ? C.white : C.muted }} className="flex-1 text-left">{h.t}</span>{on && <Check size={15} style={{ color: C.gold }} />}</button>); })}</div></Section>

      <Section title="Treino" icon={Dumbbell}>
        <div className="flex gap-2 mb-2"><input value={wName} onChange={e => setWName(e.target.value)} placeholder="Ex: Peito e tríceps" className="flex-1 rounded-xl px-3 py-2.5 text-sm outline-none" style={{ background: C.cardL, color: C.white, minWidth: 0 }} /><input value={wMin} onChange={e => setWMin(e.target.value.replace(/[^0-9]/g, ""))} placeholder="min" inputMode="numeric" className="w-16 rounded-xl px-3 py-2.5 text-sm outline-none text-center" style={{ background: C.cardL, color: C.white }} /><RoundBtn gold onClick={logWorkout}><Plus size={16} /></RoundBtn></div>
        {todayWorkouts.map(w => <LinhaRegistro key={w.id} onDel={() => delWorkout(w.id)}><div className="flex items-center justify-between text-sm"><span>{w.name}</span><span style={{ color: C.muted }}>{w.min ? `${w.min} min` : "✓"}</span></div></LinhaRegistro>)}
      </Section>

      <Section title="Alimentação" icon={Utensils}>
        <div className="flex gap-2 mb-2"><input value={meal} onChange={e => setMeal(e.target.value)} onKeyDown={e => { if (e.key === "Enter") logMeal(); }} placeholder="O que você comeu?" className="flex-1 rounded-xl px-3 py-2.5 text-sm outline-none" style={{ background: C.cardL, color: C.white, minWidth: 0 }} /><RoundBtn gold onClick={logMeal}><Plus size={16} /></RoundBtn></div>
        {todayMeals.map(m => <LinhaRegistro key={m.id} onDel={() => delMeal(m.id)}><span className="text-sm">{m.desc}</span></LinhaRegistro>)}
      </Section>

      <Section title="Peso" icon={Scale}>
        <div className="flex gap-2 items-center"><input value={weight} onChange={e => setWeight(e.target.value.replace(/[^0-9.]/g, ""))} onKeyDown={e => { if (e.key === "Enter") logWeight(); }} placeholder="kg" inputMode="decimal" className="flex-1 rounded-xl px-3 py-2.5 text-sm outline-none" style={{ background: C.cardL, color: C.white, minWidth: 0 }} /><RoundBtn gold onClick={logWeight}><Plus size={16} /></RoundBtn></div>
        {todayWeights.map(w => <LinhaRegistro key={w.id} onDel={() => delWeight(w.id)}><span className="text-sm">{w.val} kg <span style={{ color: C.muted }}>· registrado hoje</span></span></LinhaRegistro>)}
        {lastWeight && todayWeights.length === 0 ? <p className="text-sm mt-2" style={{ color: C.muted }}>Último registro: <b style={{ color: C.white }}>{lastWeight.val} kg</b> em {lastWeight.date.split("-").reverse().join("/")}</p> : null}
      </Section>

      <Section title="O que eu fiz hoje" icon={BookOpen} right={(s.diarioXp || []).includes(t) ? <Check size={16} style={{ color: C.gold }} /> : <span className="text-xs" style={{ color: C.muted }}>escreva livre</span>}>
        <p className="text-xs mb-3" style={{ color: C.muted }}>Escreva do seu jeito. Vitória, treino, tropeço, o que veio.</p>
        <textarea value={diarioHoje} onChange={e => escreverDiario(e.target.value)} rows={5} placeholder="Hoje eu..." className="w-full rounded-xl px-3 py-3 text-sm outline-none" style={{ background: C.cardL, color: C.white, border: "none", resize: "none", lineHeight: 1.6 }} />
        {diasComTexto.length > 0 ? (
          <button onClick={() => setVerHistorico(!verHistorico)} className="w-full mt-3 flex items-center justify-center gap-1.5 text-xs font-bold" style={{ background: "none", border: "none", color: C.gold, cursor: "pointer" }}>
            {verHistorico ? "Esconder os dias anteriores" : `Ver os meus ${diasComTexto.length} dias registrados`}
            <ChevronRight size={14} style={{ transform: verHistorico ? "rotate(90deg)" : "none", transition: "transform .2s" }} />
          </button>
        ) : null}
        {verHistorico ? (
          <div className="mt-3 flex flex-col gap-2">
            {diasComTexto.map(d => (
              <div key={d} className="rounded-xl px-3 py-2.5" style={{ background: C.cardL }}>
                <p className="text-xs font-bold mb-1" style={{ color: C.gold }}>{d.split("-").reverse().join("/")}</p>
                <p className="text-sm whitespace-pre-wrap" style={{ color: "#CFCFCF", lineHeight: 1.5 }}>{s.diario[d]}</p>
              </div>
            ))}
          </div>
        ) : null}
      </Section>

      <div className="h-2" />
    </div>
  );
}
function RoundBtn({ children, onClick, gold }) { return <button onClick={onClick} className="rounded-xl p-2.5 flex-shrink-0" style={{ background: gold ? C.gold : C.cardL, color: gold ? "#000" : C.white }}>{children}</button>; }

function ChallengeCard({ s, update, compact }) {
  const ch = s.challenge;
  const def = CHALLENGES.find(c => c.k === ch.k);
  const done = ch.done.length;
  const pct = Math.round((done / def.days) * 100);
  const todayDone = ch.done.includes(today());
  const mark = () => { if (todayDone) return; update(p => ({ challenge: { ...p.challenge, done: [...p.challenge.done, today()] }, xp: p.xp + 40, xpByDate: { ...p.xpByDate, [today()]: (p.xpByDate[today()] || 0) + 40 } })); };
  const quit = () => { if (confirm("Abandonar o desafio atual?")) update({ challenge: null }); };
  return (
    <Card style={{ background: "linear-gradient(135deg, rgba(212,175,55,0.10), rgba(20,20,20,1))" }}>
      <div className="flex items-center justify-between mb-2"><span className="font-bold flex items-center gap-2"><Rocket size={17} style={{ color: C.gold }} />Desafio {def.t}</span><span className="text-sm font-semibold" style={{ color: C.gold }}>{done}/{def.days}</span></div>
      <div className="h-2 rounded-full overflow-hidden mb-3" style={{ background: C.cardL }}><div className="h-full rounded-full" style={{ width: `${pct}%`, background: C.gold }} /></div>
      {!compact && <div className="flex flex-wrap gap-1.5 mb-3">{Array.from({ length: def.days }).map((_, i) => <div key={i} className="rounded" style={{ width: 14, height: 14, background: i < done ? C.gold : C.cardL }} />)}</div>}
      <div className="flex gap-2"><button onClick={mark} disabled={todayDone} className="flex-1 rounded-xl py-2.5 text-sm font-bold flex items-center justify-center gap-1.5" style={{ background: todayDone ? C.cardL : C.gold, color: todayDone ? C.muted : "#000" }}>{todayDone ? <><Check size={15} /> Dia concluído</> : <>Concluir hoje</>}</button>{!compact && <button onClick={quit} className="rounded-xl px-3" style={{ background: C.cardL, color: C.muted }}><X size={16} /></button>}</div>
    </Card>
  );
}

      <div className="flex flex-col items-center text-center pt-2">
        <div className="rounded-full flex items-center justify-center mb-3" style={{ width: 76, height: 76, background: "rgba(212,175,55,0.12)", border: `2px solid ${C.gold}` }}><span className="text-2xl font-bold" style={{ color: C.gold }}>{(s.profile.name || "V")[0].toUpperCase()}</span></div>

      </div>
      <div className="grid grid-cols-3 gap-3"><Stat icon={Rocket} v={s.voltas || 0} l="Voltas" /><Stat icon={Flame} v={s.streak} l="Dias seguidos" /><Stat icon={TrendingUp} v={s.melhorSeq || 0} l="Melhor" /></div>
      {canInstall ? (
        <button onClick={() => window.__pwaInstall && window.__pwaInstall()} className="w-full flex items-center gap-3 rounded-2xl px-4 py-3.5" style={{ background: `linear-gradient(180deg, #EBCB6E, ${C.gold})`, color: "#000", border: "none", cursor: "pointer" }}>

      <button onClick={reset} className="w-full rounded-2xl py-3.5 text-sm font-semibold flex items-center justify-center gap-2" style={{ background: C.card, color: "#FF6B6B", border: "1px solid rgba(255,107,107,0.3)" }}><X size={16} />Reiniciar progresso</button>
      <div className="h-4" />
    </div>
  );
}
function WeeklyGoalsView({ s }) {
  const goals = buildWeeklyGoals(s);
  const wk = weekKey();
  const claimed = s.weeklyGoals?.week === wk ? s.weeklyGoals.ids : [];
  return (
    <div className="space-y-4">
      <p className="text-sm leading-relaxed" style={{ color: C.muted }}>Suas metas desta semana. Elas renovam toda segunda-feira.</p>

function WeightChartView({ s }) {
  const ws = (s.weights || []).slice().reverse();
  if (ws.length < 2) {
    return (
      <div className="space-y-4">
        <p className="text-sm leading-relaxed" style={{ color: C.muted }}>Registre seu peso pelo menos 2 vezes (na aba Evoluir) pra ver aqui o gráfico da sua evolução.</p>

      </div>
    );
  }
  const vals = ws.map(w => w.val);
  const min = Math.min(...vals), max = Math.max(...vals);
  const pad = (max - min) * 0.15 || 1;
  const lo = min - pad, hi = max + pad;
  const W = 320, H = 160, padX = 12, padY = 16;
  const x = i => padX + (i / (ws.length - 1)) * (W - padX * 2);
  const y = v => padY + (1 - (v - lo) / (hi - lo)) * (H - padY * 2);
  const pts = ws.map((w, i) => `${x(i)},${y(w.val)}`).join(" ");
  const first = ws[0].val, last = ws[ws.length - 1].val, delta = +(last - first).toFixed(1);
  return (
    <div className="space-y-5">
      <div className="flex items-end justify-between">
        <div><p className="text-xs" style={{ color: C.muted }}>Atual</p><p className="text-3xl font-bold" style={{ color: C.gold }}>{last}<span className="text-base" style={{ color: C.muted }}> kg</span></p></div>
        <div className="text-right"><p className="text-xs" style={{ color: C.muted }}>Variação total</p><p className="text-lg font-bold" style={{ color: delta === 0 ? C.muted : (delta < 0 ? "#5BD6A0" : "#E0A93B") }}>{delta > 0 ? "+" : ""}{delta} kg</p></div>
      </div>
      <div className="rounded-2xl p-3" style={{ background: C.card, border: `1px solid ${C.border}` }}>
        <svg viewBox={`0 0 ${W} ${H}`} style={{ width: "100%", height: "auto", display: "block" }}>
          <polyline fill="none" stroke={C.gold} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" points={pts} />
          {ws.map((w, i) => <circle key={i} cx={x(i)} cy={y(w.val)} r="3" fill={C.gold} />)}
        </svg>
        <div className="flex justify-between mt-1"><span className="text-[10px]" style={{ color: C.muted }}>{ws[0].date}</span><span className="text-[10px]" style={{ color: C.muted }}>{ws[ws.length - 1].date}</span></div>
      </div>
      <p className="text-xs" style={{ color: C.muted }}>Peso inicial registrado: {first} kg · {ws.length} registros no total.</p>
    </div>
  );
}
function RemindersView({ s, update, fireToast }) {

    if (typeof Notification === "undefined") { if (fireToast) fireToast("Seu navegador não suporta notificações."); return; }

      update(prev => ({ ...prev, notif: { ...(prev.notif || {}), on: true } }));

      setPerm("denied");

  };

      )}

function PhotosView({ s, update, fireToast }) {

  const onPick = (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    setBusy(true);
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const max = 720;
        let w = img.width, h = img.height;
        if (w > h && w > max) { h = Math.round(h * max / w); w = max; }
        else if (h > max) { w = Math.round(w * max / h); h = max; }
        const cv = document.createElement("canvas");
        cv.width = w; cv.height = h;
        cv.getContext("2d").drawImage(img, 0, 0, w, h);
        const data = cv.toDataURL("image/jpeg", 0.55);
        const novo = { id: Date.now().toString(), date: today(), img: data };
        update(p => {
          let arr = [...(p.photos || []), novo];
          if (arr.length > 12) arr = [arr[0], ...arr.slice(-11)];
          return { ...p, photos: arr };
        });
        setBusy(false);
        if (fireToast) fireToast("Foto adicionada!");
      };
      img.onerror = () => { setBusy(false); if (fireToast) fireToast("Imagem inválida."); };
      img.src = reader.result;
    };
    reader.onerror = () => { setBusy(false); if (fireToast) fireToast("Não consegui ler a foto."); };
    reader.readAsDataURL(file);
    if (fileRef.current) fileRef.current.value = "";
  };

  const remover = (id) => {

function BackupView({ s, update, fireToast }) {
  const fileRef = useRef(null);

  const exportar = () => {
    try {
      const blob = new Blob([JSON.stringify(s, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "vivon-backup-" + new Date().toISOString().slice(0, 10) + ".json";
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
      if (fireToast) fireToast("Backup baixado!");
    } catch { if (fireToast) fireToast("Não consegui exportar."); }
  };

  const importar = (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const obj = JSON.parse(reader.result);
        if (!obj || typeof obj !== "object" || (obj.profile === undefined && obj.xp === undefined)) {
          if (fireToast) fireToast("Arquivo inválido.");
        } else if (confirm("Isso vai substituir seus dados atuais pelos do backup. Continuar?")) {
          update(() => ({ ...DEFAULT, ...obj }));
          if (fireToast) fireToast("Dados restaurados!");
        }
      } catch { if (fireToast) fireToast("Não consegui ler o arquivo."); }
      if (fileRef.current) fileRef.current.value = "";
    };
    reader.readAsText(file);
  };

  return (
    <div className="space-y-4">
      <p className="text-sm leading-relaxed" style={{ color: C.muted }}>
        Seus dados ficam salvos neste aparelho. Faça um backup para não perder seu progresso se trocar de celular ou limpar o navegador.
      </p>
      <Btn onClick={exportar}>Exportar meus dados <TrendingUp size={18} /></Btn>
      <button onClick={() => fileRef.current && fileRef.current.click()} className="w-full rounded-2xl py-4 font-bold flex items-center justify-center gap-2" style={{ background: C.card, color: C.gold, border: `1px solid ${C.border}`, cursor: "pointer" }}>
        Importar backup
      </button>
      <input ref={fileRef} type="file" accept="application/json,.json" onChange={importar} style={{ display: "none" }} />
      <p className="text-xs" style={{ color: C.muted }}>O arquivo é um .json — guarde no Google Drive, email ou onde preferir.</p>
    </div>
  );
}

}
function Panel({ title, onBack, children }) { return (<div className="px-5 pt-6"><div className="flex items-center gap-3 mb-5"><button onClick={onBack} className="rounded-xl p-2" style={{ background: C.card }}><ChevronLeft size={18} style={{ color: C.gold }} /></button><h1 className="text-xl font-bold">{title}</h1></div>{children}<div className="h-6" /></div>); }
function Achievements({ s }) { return (<div className="grid grid-cols-2 gap-3">{ACHV.map(a => { const got = s.achievements.includes(a.id); return (<div key={a.id} className="rounded-2xl p-3.5 flex flex-col gap-1.5" style={{ background: a.rare ? "linear-gradient(135deg, rgba(212,175,55,0.14), rgba(20,20,20,1))" : C.card, border: `1px solid ${got ? C.gold : C.border}`, opacity: got ? 1 : 0.4 }}><div className="flex items-center justify-between"><a.icon size={20} style={{ color: got ? C.gold : C.muted }} />{a.rare && <span className="text-[9px] font-bold px-1.5 py-0.5 rounded" style={{ background: "rgba(212,175,55,0.2)", color: C.gold }}>RARA</span>}</div><span className="font-semibold text-sm">{a.name}</span><span className="text-[11px]" style={{ color: C.muted }}>{a.desc}</span></div>); })}</div>); }
function LevelsView({ s }) { const li = levelInfo(s.xp); return (<div className="space-y-3"><Card className="text-center"><p className="text-sm" style={{ color: C.muted }}>Seu nível</p><p className="text-4xl font-bold" style={{ color: C.gold }}>{li.level}<span className="text-lg" style={{ color: C.muted }}>/100</span></p><div className="h-2 rounded-full overflow-hidden mt-3" style={{ background: C.cardL }}><div className="h-full rounded-full" style={{ width: `${li.pct}%`, background: C.gold }} /></div><p className="text-xs mt-2" style={{ color: C.muted }}>{li.current}/{li.need} XP para o próximo</p></Card><div className="space-y-2">{LEVEL_REWARDS.map(r => { const got = li.level >= r.lvl; return (<div key={r.lvl} className="flex items-center gap-3 rounded-2xl px-4 py-3" style={{ background: C.card, border: `1px solid ${got ? C.gold : C.border}`, opacity: got ? 1 : 0.55 }}><div className="rounded-lg p-2" style={{ background: got ? "rgba(212,175,55,0.15)" : C.cardL }}>{got ? <r.icon size={18} style={{ color: C.gold }} /> : <Lock size={18} style={{ color: C.muted }} />}</div><div className="flex-1"><p className="font-semibold text-sm">{r.t}</p><p className="text-xs" style={{ color: C.muted }}>Nível {r.lvl}</p></div>{got && <Check size={16} style={{ color: C.gold }} />}</div>); })}</div></div>); }
function ChallengesView({ s, update }) { const start = (k) => update({ challenge: { k, start: today(), done: [] } }); return (<div className="space-y-3">{s.challenge && <ChallengeCard s={s} update={update} />}{!s.challenge && CHALLENGES.map(c => (<button key={c.k} onClick={() => start(c.k)} className="w-full text-left rounded-2xl p-4" style={{ background: C.card, border: `1px solid ${C.border}` }}><div className="flex items-center justify-between mb-1"><span className="font-bold flex items-center gap-2"><Rocket size={17} style={{ color: C.gold }} />{c.t}</span><span className="text-xs px-2 py-0.5 rounded-full" style={{ background: "rgba(212,175,55,0.15)", color: C.gold }}>{c.days} dias</span></div><p className="text-sm" style={{ color: C.muted }}>{c.desc}</p></button>))}{s.challenge && <p className="text-xs text-center" style={{ color: C.muted }}>Conclua o desafio atual para iniciar outro.</p>}</div>); }
function LibraryView({ s, fireToast }) { const cats = Object.keys(LIBRARY); const [cat, setCat] = useState(cats[0]); const li = levelInfo(s.xp); return (<div><div className="flex gap-2 overflow-x-auto pb-3">{cats.map(c => <button key={c} onClick={() => setCat(c)} className="px-3.5 py-2 rounded-full whitespace-nowrap text-sm font-semibold" style={{ background: cat === c ? C.gold : C.card, color: cat === c ? "#000" : C.white, border: `1px solid ${cat === c ? C.gold : C.border}` }}>{c}</button>)}</div><div className="space-y-2.5">{LIBRARY[cat].map((it, i) => { const locked = li.level < it.lvl; return (<button key={i} onClick={() => fireToast(locked ? `🔒 Desbloqueia no nível ${it.lvl}` : "▶ Conteúdo em breve")} className="w-full flex items-center gap-3 rounded-2xl px-4 py-3.5" style={{ background: C.card, border: `1px solid ${C.border}`, opacity: locked ? 0.55 : 1 }}><div className="rounded-lg p-2" style={{ background: "rgba(212,175,55,0.12)" }}>{locked ? <Lock size={16} style={{ color: C.muted }} /> : <BookOpen size={16} style={{ color: C.gold }} />}</div><div className="flex-1 text-left"><p className="font-semibold text-sm">{it.t}</p><p className="text-xs" style={{ color: C.muted }}>{locked ? `Nível ${it.lvl}` : it.d}</p></div>{!locked && <ChevronRight size={16} style={{ color: C.muted }} />}</button>); })}</div></div>); }
function ReferralView({ s, fireToast }) { const code = "VIVON-" + (s.profile.name || "VOCE").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 6); const copy = () => { try { navigator.clipboard.writeText(code); fireToast("Código copiado!"); } catch { fireToast(code); } }; const tiers = [{ n: 1, r: "7 dias grátis", icon: Star }, { n: 3, r: "1 mês grátis", icon: Medal }, { n: 5, r: "Tema exclusivo Ouro", icon: Crown }]; return (<div className="space-y-4"><Card className="text-center" style={{ background: "linear-gradient(135deg, rgba(212,175,55,0.12), rgba(20,20,20,1))" }}><Gift size={28} style={{ color: C.gold }} className="mx-auto mb-2" /><p className="text-sm" style={{ color: C.muted }}>Seu código de indicação</p><p className="text-2xl font-bold tracking-wider my-2" style={{ color: C.gold }}>{code}</p><button onClick={copy} className="rounded-xl px-5 py-2.5 text-sm font-bold inline-flex items-center gap-2" style={{ background: C.gold, color: "#000" }}><Copy size={15} />Copiar código</button></Card><p className="text-sm font-semibold">Cada amigo que assinar te dá:</p><div className="space-y-2.5">{tiers.map(t => (<div key={t.n} className="flex items-center gap-3 rounded-2xl px-4 py-3" style={{ background: C.card, border: `1px solid ${C.border}` }}><div className="rounded-lg p-2" style={{ background: "rgba(212,175,55,0.12)" }}><t.icon size={18} style={{ color: C.gold }} /></div><div className="flex-1"><p className="font-semibold text-sm">{t.r}</p><p className="text-xs" style={{ color: C.muted }}>Com {t.n} {t.n === 1 ? "indicação" : "indicações"}</p></div></div>))}</div><p className="text-xs text-center" style={{ color: C.muted }}>Indicações ativas: 0 · conecte ao backend para rastrear automaticamente.</p></div>); }

function TopBar({ s, update }) {
  return (
    <div className="flex items-center justify-between px-5 pt-4 pb-1">
      <Logo size={20} />
      <div className="flex items-center gap-2">
        <div className="flex items-center gap-1.5 px-2.5 py-1.5 rounded-full" style={{ background: C.card, border: `1px solid ${C.border}` }}><Rocket size={13} style={{ color: C.gold }} /><span className="text-xs font-bold">{s.voltas || 0}</span></div>
        <div className="flex items-center gap-1.5 px-2.5 py-1.5 rounded-full" style={{ background: C.card, border: `1px solid ${C.border}` }}><Flame size={13} style={{ color: C.gold }} /><span className="text-xs font-bold">{s.streak}</span></div>
        <button onClick={() => update({ tab: "profile" })} className="rounded-full p-1.5" style={{ background: C.card, border: `1px solid ${C.border}` }} aria-label="Perfil"><User size={15} style={{ color: s.tab === "profile" ? C.gold : C.muted }} /></button>
      </div>
    </div>
  );
}

function Nav({ tab, setTab }) {
  const items = [
    { k: "hoje", icon: Home, l: "Hoje" },
    { k: "treinos", icon: Dumbbell, l: "Treinos" },
    { k: "dash", icon: TrendingUp, l: "Evolução" },
    { k: "ai", icon: Brain, l: "IA" },
  ];
  const isActive = (k) => k === "hoje" ? ["hoje", "home", "track", "metas"].includes(tab) : tab === k;
  return (
    <div className="fixed bottom-0 left-1/2 w-full" style={{ maxWidth: 440, transform: "translateX(-50%)", background: "rgba(10,10,10,0.94)", backdropFilter: "blur(12px)", borderTop: `1px solid ${C.border}` }}>
      <div className="flex items-end justify-around px-2 py-3">
        {items.map(it => {
          const active = isActive(it.k);
          return (
            <button key={it.k} onClick={() => setTab(it.k)} className="flex flex-col items-center gap-1 flex-1">
              <it.icon size={21} style={{ color: active ? C.gold : C.muted }} />
              <span className="text-[10px] font-medium" style={{ color: active ? C.gold : C.muted }}>{it.l}</span>
            </button>
          );
        })}
      </div>
      <div style={{ height: "env(safe-area-inset-bottom)" }} />
    </div>
  );
}

createRoot(document.getElementById("root")).render(<VivonApp />);
  </script>
</body>
</html>
