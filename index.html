function today() { return new Date().toISOString().slice(0, 10); }
function yesterday() { const d = new Date(); d.setDate(d.getDate() - 1); return d.toISOString().slice(0, 10); }
function lastN(n) { const a = []; for (let i = n - 1; i >= 0; i--) { const d = new Date(); d.setDate(d.getDate() - i); a.push(d.toISOString().slice(0, 10)); } return a; }
function dayLabel(iso) { return ["Dom", "Seg", "Ter", "Qua", "Qui", "Sex", "Sáb"][new Date(iso + "T12:00").getDay()]; }

function levelInfo(xp) {
  let level = 1, acc = 0, need = 200;
  while (xp >= acc + need && level < 100) { acc += need; level++; need = 200 + (level - 1) * 100; }
  return { level, current: xp - acc, need, pct: Math.min(100, ((xp - acc) / need) * 100) };
}
function waterToday(s) { return s.water.date === today() ? s.water.count : 0; }
function sleepToday(s) { return s.sleep?.date === today() ? s.sleep.hours : 0; }
function habitsDoneToday(s) { return s.habits.date === today() ? HABITS.filter(h => s.habits.done[h.k]).length : 0; }
function workoutToday(s) { return s.workouts.some(w => w.date === today()); }
function mealToday(s) { return s.meals.some(m => m.date === today()); }
function aiToday(s) { return s.aiLog?.date === today() && s.aiLog.count > 0; }
function totalAi(s) { return Object.values(s.chats).reduce((a, c) => a + c.filter(m => m.role === "user").length, 0); }
function currentWeight(s) { return s.weights[0]?.val ?? (parseFloat(s.profile.weight) || null); }
function startWeight(s) { return parseFloat(s.profile.weight) || s.weights[s.weights.length - 1]?.val || null; }
function consistency(s) { const days = lastN(7); const active = days.filter(d => (s.xpByDate[d] || 0) > 0).length; return Math.round((active / 7) * 100); }

function vivonScore(s) {
  const water = Math.min(1, waterToday(s) / 8) * 20;
  const sleep = Math.min(1, sleepToday(s) / 8) * 15;
  const wk = workoutToday(s) ? 20 : 0;
  const meal = mealToday(s) ? 15 : 0;
  const hab = (habitsDoneToday(s) / HABITS.length) * 20;
  const ai = aiToday(s) ? 10 : 0;
  return Math.round(water + sleep + wk + meal + hab + ai);
}
function scoreParts(s) {
  return [
    { l: "Água", v: Math.round(Math.min(1, waterToday(s) / 8) * 20), m: 20 },
    { l: "Sono", v: Math.round(Math.min(1, sleepToday(s) / 8) * 15), m: 15 },
    { l: "Treino", v: workoutToday(s) ? 20 : 0, m: 20 },
    { l: "Alimentação", v: mealToday(s) ? 15 : 0, m: 15 },
    { l: "Hábitos", v: Math.round((habitsDoneToday(s) / HABITS.length) * 20), m: 20 },
    { l: "IA", v: aiToday(s) ? 10 : 0, m: 10 },
  ];
}
function buildMissions(s) {
  return [
    { id: "water", t: "Beber 2L de água", xp: 20, done: waterToday(s) >= 8, icon: Droplet },
    { id: "workout", t: "Fazer um treino", xp: 30, done: workoutToday(s), icon: Dumbbell },
    { id: "ai", t: "Conversar com a VIVON AI", xp: 15, done: aiToday(s), icon: Brain },
    { id: "sleep", t: "Dormir 8 horas", xp: 20, done: sleepToday(s) >= 8, icon: Bed },
    { id: "checklist", t: "Completar o checklist", xp: 25, done: habitsDoneToday(s) === HABITS.length, icon: ClipboardCheck },
  ];
}

  const toastTimer = useRef(null);

  useEffect(() => {
    try {
      const raw = localStorage.getItem("vivon-state");
      setS(raw ? { ...DEFAULT, ...JSON.parse(raw) } : DEFAULT);
    } catch { setS(DEFAULT); }
    loaded.current = true;
  }, []);

  useEffect(() => {
    if (!s || !loaded.current) return;
    try { localStorage.setItem("vivon-state", JSON.stringify(s)); } catch {}
  }, [s]);

  useEffect(() => {
    if (!s || s.screen !== "app") return;
    const newly = ACHV.filter(a => !s.achievements.includes(a.id) && a.cond(s));
    if (newly.length) {
      setS(p => {
        const t = today(); const bonus = newly.length * 50;
        return { ...p, achievements: [...p.achievements, ...newly.map(a => a.id)], xp: p.xp + bonus, xpByDate: { ...p.xpByDate, [t]: (p.xpByDate[t] || 0) + bonus } };
      });
      fireToast("🏆 " + newly.map(a => a.name).join(" · "));
    }
  }, [s]);

  useEffect(() => {
    if (!s || s.screen !== "app") return;
    const t = today();
    const claimed = s.missionsClaimed?.date === t ? s.missionsClaimed.ids : [];
    const newly = buildMissions(s).filter(m => m.done && !claimed.includes(m.id));
    if (newly.length) {
      setS(p => {
        const tt = today();
        const cl = p.missionsClaimed?.date === tt ? p.missionsClaimed.ids : [];
        const bonus = newly.reduce((a, m) => a + m.xp, 0);
        return { ...p, xp: p.xp + bonus, xpByDate: { ...p.xpByDate, [tt]: (p.xpByDate[tt] || 0) + bonus }, missionsClaimed: { date: tt, ids: [...cl, ...newly.map(m => m.id)] } };
      });
      fireToast("✅ Missão concluída · +" + newly.reduce((a, m) => a + m.xp, 0) + " XP");
    }
  }, [s]);

  function fireToast(msg) {
    setToast(msg);
    clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(""), 2600);
  }

  if (!s) return <Splash />;

  const award = (amount) => setS(p => {
    const t = today(), y = yesterday();
    let streak = p.streak, last = p.lastActive;
    if (last !== t) { streak = last === y ? streak + 1 : 1; last = t; }
    return { ...p, xp: p.xp + amount, lastActive: last, streak, xpByDate: { ...p.xpByDate, [t]: (p.xpByDate[t] || 0) + amount } };
  });
  const update = (patch) => setS(p => ({ ...p, ...(typeof patch === "function" ? patch(p) : patch) }));

  if (s.screen === "onboarding") return <Onboarding s={s} update={update} award={award} />;

  return (
    <div style={{ background: C.bg, color: C.white, minHeight: "100vh" }} className="w-full">
      <GlobalAnim />
      <div className="mx-auto flex flex-col" style={{ maxWidth: 440, minHeight: "100vh" }}>
        {toast && (
          <div className="fixed left-1/2 z-50 px-4 py-2.5 rounded-xl text-sm font-semibold" style={{ top: 16, transform: "translateX(-50%)", background: C.gold, color: "#000", boxShadow: "0 8px 30px rgba(212,175,55,0.4)" }}>{toast}</div>
        )}
        <div className="flex-1 overflow-y-auto pb-24">
          {s.tab === "home" && <HomeTab s={s} update={update} />}
          {s.tab === "track" && <TrackTab s={s} update={update} award={award} />}
          {s.tab === "treinos" && <TreinosTab />}
          {s.tab === "dash" && <DashboardTab s={s} setS={setS} />}
          {s.tab === "ai" && <AITab s={s} setS={setS} award={award} />}
          {s.tab === "profile" && <ProfileTab s={s} update={update} award={award} fireToast={fireToast} />}
        </div>
        <Nav tab={s.tab} setTab={(t) => update({ tab: t })} />
      </div>
    </div>
  );
}

function GlobalAnim() {

    @keyframes vFade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

}
function Splash() { return <div style={{ background: C.bg, minHeight: "100vh" }} className="flex items-center justify-center"><Logo size={42} /></div>; }
function Logo({ size = 28 }) { return <span style={{ fontSize: size, fontWeight: 800, letterSpacing: "0.18em", color: C.white }}>VIV<span style={{ color: C.gold }}>O</span>N</span>; }

function Card({ children, className = "", style = {} }) { return <div className={`rounded-2xl p-4 ${className}`} style={{ background: C.card, border: `1px solid ${C.border}`, ...style }}>{children}</div>; }

function Section({ title, icon: I, children, right }) { return <Card><div className="flex items-center justify-between mb-3"><h3 className="font-semibold flex items-center gap-2"><I size={17} style={{ color: C.gold }} />{title}</h3>{right}</div>{children}</Card>; }
function ScoreRing({ value, size = 132 }) {
  const r = (size - 18) / 2, circ = 2 * Math.PI * r, off = circ * (1 - value / 100);
  return (
    <svg width={size} height={size} style={{ display: "block" }}>
      <defs><linearGradient id="vg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stopColor="#F0D982" /><stop offset="100%" stopColor={C.gold} /></linearGradient></defs>
      <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke={C.cardL} strokeWidth="9" />
      <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke="url(#vg)" strokeWidth="9" strokeLinecap="round" strokeDasharray={circ} strokeDashoffset={off} transform={`rotate(-90 ${size / 2} ${size / 2})`} style={{ transition: "stroke-dashoffset .6s ease" }} />
      <text x="50%" y="47%" textAnchor="middle" fontSize="30" fontWeight="800" fill={C.white}>{value}</text>
      <text x="50%" y="64%" textAnchor="middle" fontSize="11" fill={C.muted}>SCORE</text>

}
function MiniBars({ dates, data, max }) {

  return <div className="flex items-end justify-between gap-1" style={{ height: 80 }}>{dates.map(d => { const h = Math.max(4, ((data[d] || 0) / m) * 70); const t = d === today(); return <div key={d} className="flex-1 rounded-sm" style={{ height: h, background: t ? C.gold : "rgba(212,175,55,0.28)" }} />; })}</div>;
}

function DashboardTab({ s, setS }) {
  const li = levelInfo(s.xp);
  const score = vivonScore(s);
  const cw = currentWeight(s), iw = startWeight(s);
  const delta = cw != null && iw != null ? +(cw - iw).toFixed(1) : null;
  const cons = consistency(s);

      </Card>
      <div className="grid grid-cols-4 gap-2"><Stat icon={Crown} v={li.level} l="Nível" /><Stat icon={Zap} v={s.xp} l="XP" /><Stat icon={Flame} v={s.streak} l="Seq." /><Stat icon={Activity} v={`${cons}%`} l="Consist." /></div>
      <Section title="Evolução semanal" icon={TrendingUp}><MiniBars dates={lastN(7)} data={s.xpByDate} /><div className="flex justify-between mt-1">{lastN(7).map(d => <span key={d} className="text-[10px] flex-1 text-center" style={{ color: d === today() ? C.gold : C.muted }}>{dayLabel(d)}</span>)}</div></Section>
      <Section title="Evolução mensal" icon={BarChart3}><MiniBars dates={lastN(30)} data={s.xpByDate} /><p className="text-xs mt-2" style={{ color: C.muted }}>XP acumulado nos últimos 30 dias</p></Section>
      <div className="grid grid-cols-2 gap-3">

        <Card><div className="flex items-center gap-2 mb-2"><Target size={16} style={{ color: C.gold }} /><span className="text-sm font-semibold">Meta</span></div><p className="text-lg font-bold">{goal ? `${goal.e} ${goal.t}` : "—"}</p><p className="text-xs mt-1" style={{ color: C.muted }}>{habitsDoneToday(s)}/6 hábitos · {waterToday(s)}/8 água</p></Card>
      </div>
      <Card>
        <div className="flex items-center justify-between mb-1"><span className="font-semibold flex items-center gap-2"><Sparkles size={17} style={{ color: C.gold }} />IA Analista</span></div>

        {s.analysis?.text && <div className="rounded-xl p-3 mb-3 text-sm whitespace-pre-wrap leading-relaxed" style={{ background: C.cardL, color: "#E0E0E0", maxHeight: 260, overflowY: "auto" }}>{s.analysis.text}</div>}

function AITab({ s, setS, award }) {
  const [mode, setMode] = useState("coach");
  const [input, setInput] = useState("");
  const [loading, setLoading] = useState(false);
  const scroller = useRef(null);
  const msgs = s.chats[mode] || [];
  const M = MODES[mode];
  useEffect(() => { if (scroller.current) scroller.current.scrollTop = scroller.current.scrollHeight; }, [msgs, loading]);

  const ctx = () => {
    const p = s.profile;
    const g = GOALS.find(x => x.k === p.goal)?.t || "—";
    const l = LEVELS.find(x => x.k === p.level)?.t || "—";
    const recent = s.workouts.slice(0, 3).map(w => w.name).join(", ") || "nenhum";
    return `Contexto real do usuário (use para personalizar): nome ${p.name || "—"}, objetivo ${g}, nível de treino ${l}, idade ${p.age || "—"}, peso atual ${currentWeight(s) ?? "—"}kg, peso inicial ${startWeight(s) ?? "—"}kg, sequência ${s.streak} dias, nível VIVON ${levelInfo(s.xp).level}, score hoje ${vivonScore(s)}/100, treinos recentes: ${recent}, hábitos hoje ${habitsDoneToday(s)}/6. Responda em português do Brasil, objetivo e premium.`;
  };

  const send = async (preset) => {
    const text = (preset ?? input).trim();
    if (!text || loading) return;
    const history = [...msgs, { role: "user", content: text }];
    setS(p => ({ ...p, chats: { ...p.chats, [mode]: history }, aiLog: { date: today(), count: (p.aiLog?.date === today() ? p.aiLog.count : 0) + 1 } }));
    setInput(""); setLoading(true); award(5);
    try {
      const res = await fetch(AI_ENDPOINT, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ max_tokens: 1000, system: `${M.sys} ${ctx()}`, messages: history.map(m => ({ role: m.role, content: m.content })) }) });
      const data = await res.json();
      const reply = (data.content || []).filter(b => b.type === "text").map(b => b.text).join("\n").trim() || "Não consegui responder agora. Tenta de novo?";
      setS(p => ({ ...p, chats: { ...p.chats, [mode]: [...history, { role: "assistant", content: reply }] } }));
    } catch { setS(p => ({ ...p, chats: { ...p.chats, [mode]: [...history, { role: "assistant", content: "Não consegui conectar com a IA. (Configure a função vivon-ai e a chave no Netlify.)" }] } })); }
    finally { setLoading(false); }
  };

  return (
    <div className="flex flex-col" style={{ height: "calc(100vh - 80px)" }}>
      <div className="px-5 pt-6 pb-3">
        <div className="flex items-center gap-2 mb-4"><Brain size={22} style={{ color: C.gold }} /><h1 className="text-xl font-bold">VIVON AI</h1></div>
        <div className="flex gap-2 overflow-x-auto pb-1">{Object.entries(MODES).map(([k, m]) => (<button key={k} onClick={() => setMode(k)} className="flex items-center gap-1.5 px-3.5 py-2 rounded-full whitespace-nowrap text-sm font-semibold transition" style={{ background: mode === k ? C.gold : C.card, color: mode === k ? "#000" : C.white, border: `1px solid ${mode === k ? C.gold : C.border}` }}><m.icon size={15} />{m.short}</button>))}</div>
      </div>
      <div ref={scroller} className="flex-1 overflow-y-auto px-5 space-y-3">
        {msgs.length === 0 && (<>
          <Card className="mt-2"><div className="flex items-center gap-2 mb-2"><M.icon size={18} style={{ color: C.gold }} /><span className="font-semibold">{M.name}</span></div><p style={{ color: C.muted }} className="text-sm leading-relaxed">{M.intro}</p></Card>
          <div className="flex flex-col gap-2">{M.chips.map(c => <button key={c} onClick={() => send(c)} className="text-left rounded-xl px-3.5 py-2.5 text-sm flex items-center justify-between" style={{ background: C.cardL, color: "#D8D8D8" }}>{c}<ChevronRight size={15} style={{ color: C.gold }} /></button>)}</div>
        </>)}
        {msgs.map((m, i) => (<div key={i} className={`flex ${m.role === "user" ? "justify-end" : "justify-start"}`}><div className="max-w-[85%] rounded-2xl px-4 py-2.5 text-sm leading-relaxed whitespace-pre-wrap" style={m.role === "user" ? { background: C.gold, color: "#000", borderBottomRightRadius: 4 } : { background: C.card, color: C.white, border: `1px solid ${C.border}`, borderBottomLeftRadius: 4 }}>{m.content}</div></div>))}
        {loading && <div className="flex justify-start"><div className="rounded-2xl px-4 py-3" style={{ background: C.card, border: `1px solid ${C.border}` }}><Loader2 size={18} className="animate-spin" style={{ color: C.gold }} /></div></div>}
      </div>
      <div className="px-4 py-3 flex items-center gap-2" style={{ borderTop: `1px solid ${C.border}` }}>
        <input value={input} onChange={e => setInput(e.target.value)} onKeyDown={e => e.key === "Enter" && send()} placeholder={`Fale com o ${M.short}...`} className="flex-1 rounded-full px-4 py-3 text-sm outline-none" style={{ background: C.card, color: C.white, border: `1px solid ${C.border}` }} />
        <button onClick={() => send()} disabled={loading || !input.trim()} className="rounded-full p-3 flex-shrink-0" style={{ background: input.trim() && !loading ? C.gold : C.cardL, color: "#000" }}><Send size={18} /></button>
      </div>
    </div>
  );
}

function TrackTab({ s, update, award }) {
  const t = today();
  const water = waterToday(s);
  const habitsDone = s.habits.date === t ? s.habits.done : {};
  const sleepH = sleepToday(s);
  const [wName, setWName] = useState(""); const [wMin, setWMin] = useState("");
  const [meal, setMeal] = useState(""); const [weight, setWeight] = useState("");

  const setWater = (n) => update(() => ({ water: { date: t, count: Math.max(0, n) } }));
  const addWater = () => { setWater(water + 1); award(10); };
  const setSleep = (h) => update(() => ({ sleep: { date: t, hours: Math.max(0, Math.min(14, h)) } }));
  const toggleHabit = (k) => { const cur = s.habits.date === t ? s.habits.done : {}; const on = !cur[k]; update({ habits: { date: t, done: { ...cur, [k]: on } } }); if (on) award(15); };
  const logWorkout = () => { if (!wName.trim()) return; update(p => ({ workouts: [{ id: Date.now(), date: t, name: wName.trim(), min: wMin }, ...p.workouts] })); setWName(""); setWMin(""); award(50); };
  const logMeal = () => { if (!meal.trim()) return; update(p => ({ meals: [{ id: Date.now(), date: t, desc: meal.trim() }, ...p.meals] })); setMeal(""); award(20); };
  const logWeight = () => { if (!weight) return; update(p => ({ weights: [{ id: Date.now(), date: t, val: parseFloat(weight) }, ...p.weights] })); setWeight(""); award(10); };
  const lastWeight = s.weights[0];
  const todayWorkouts = s.workouts.filter(w => w.date === t);

  return (
    <div className="px-5 pt-6 space-y-4">
      <h1 className="text-xl font-bold flex items-center gap-2"><Zap size={20} style={{ color: C.gold }} />Evoluir hoje</h1>
      <Section title="Hidratação" icon={Droplet}><div className="flex items-center justify-between"><div className="flex items-center gap-1">{Array.from({ length: 8 }).map((_, i) => <Droplet key={i} size={20} style={{ color: i < water ? C.gold : C.cardL }} fill={i < water ? C.gold : "none"} />)}</div><div className="flex items-center gap-2"><RoundBtn onClick={() => setWater(water - 1)}><Minus size={16} /></RoundBtn><RoundBtn gold onClick={addWater}><Plus size={16} /></RoundBtn></div></div></Section>
      <Section title="Sono" icon={Bed} right={<span className="font-bold" style={{ color: C.gold }}>{sleepH}h</span>}><div className="flex items-center gap-2"><RoundBtn onClick={() => setSleep(sleepH - 0.5)}><Minus size={16} /></RoundBtn><div className="flex-1 h-2 rounded-full overflow-hidden" style={{ background: C.cardL }}><div className="h-full rounded-full" style={{ width: `${Math.min(100, (sleepH / 8) * 100)}%`, background: C.gold }} /></div><RoundBtn gold onClick={() => setSleep(sleepH + 0.5)}><Plus size={16} /></RoundBtn></div><p className="text-xs mt-2" style={{ color: C.muted }}>Meta: 8 horas</p></Section>
      <Section title="Hábitos do dia" icon={Check}><div className="grid grid-cols-2 gap-2">{HABITS.map(h => { const on = habitsDone[h.k]; return (<button key={h.k} onClick={() => toggleHabit(h.k)} className="flex items-center gap-2 rounded-xl px-3 py-2.5 text-sm transition" style={{ background: on ? "rgba(212,175,55,0.12)" : C.cardL, border: `1px solid ${on ? C.gold : "transparent"}` }}><h.icon size={16} style={{ color: on ? C.gold : C.muted }} /><span style={{ color: on ? C.white : C.muted }} className="flex-1 text-left">{h.t}</span>{on && <Check size={15} style={{ color: C.gold }} />}</button>); })}</div></Section>
      <Section title="Treino" icon={Dumbbell}><div className="flex gap-2 mb-2"><input value={wName} onChange={e => setWName(e.target.value)} placeholder="Ex: Peito e tríceps" className="flex-1 rounded-xl px-3 py-2.5 text-sm outline-none" style={{ background: C.cardL, color: C.white, minWidth: 0 }} /><input value={wMin} onChange={e => setWMin(e.target.value.replace(/[^0-9]/g, ""))} placeholder="min" inputMode="numeric" className="w-16 rounded-xl px-3 py-2.5 text-sm outline-none text-center" style={{ background: C.cardL, color: C.white }} /><RoundBtn gold onClick={logWorkout}><Plus size={16} /></RoundBtn></div>{todayWorkouts.map(w => <div key={w.id} className="flex items-center justify-between text-sm py-1.5"><span>{w.name}</span><span style={{ color: C.muted }}>{w.min ? `${w.min} min` : "✓"}</span></div>)}</Section>
      <Section title="Alimentação" icon={Utensils}><div className="flex gap-2 mb-2"><input value={meal} onChange={e => setMeal(e.target.value)} placeholder="O que você comeu?" className="flex-1 rounded-xl px-3 py-2.5 text-sm outline-none" style={{ background: C.cardL, color: C.white, minWidth: 0 }} /><RoundBtn gold onClick={logMeal}><Plus size={16} /></RoundBtn></div>{s.meals.filter(m => m.date === t).map(m => <div key={m.id} className="text-sm py-1.5">{m.desc}</div>)}</Section>
      <Section title="Peso" icon={Scale}><div className="flex gap-2 items-center"><input value={weight} onChange={e => setWeight(e.target.value.replace(/[^0-9.]/g, ""))} placeholder="kg" inputMode="decimal" className="flex-1 rounded-xl px-3 py-2.5 text-sm outline-none" style={{ background: C.cardL, color: C.white, minWidth: 0 }} /><RoundBtn gold onClick={logWeight}><Plus size={16} /></RoundBtn></div>{lastWeight && <p className="text-sm mt-2" style={{ color: C.muted }}>Último registro: <b style={{ color: C.white }}>{lastWeight.val} kg</b></p>}</Section>
      <div className="h-2" />
    </div>
  );
}
function RoundBtn({ children, onClick, gold }) { return <button onClick={onClick} className="rounded-xl p-2.5 flex-shrink-0" style={{ background: gold ? C.gold : C.cardL, color: gold ? "#000" : C.white }}>{children}</button>; }

function ChallengeCard({ s, update, compact }) {
  const ch = s.challenge;
  const def = CHALLENGES.find(c => c.k === ch.k);
  const done = ch.done.length;
  const pct = Math.round((done / def.days) * 100);
  const todayDone = ch.done.includes(today());
  const mark = () => { if (todayDone) return; update(p => ({ challenge: { ...p.challenge, done: [...p.challenge.done, today()] }, xp: p.xp + 40, xpByDate: { ...p.xpByDate, [today()]: (p.xpByDate[today()] || 0) + 40 } })); };
  const quit = () => { if (confirm("Abandonar o desafio atual?")) update({ challenge: null }); };
  return (
    <Card style={{ background: "linear-gradient(135deg, rgba(212,175,55,0.10), rgba(20,20,20,1))" }}>
      <div className="flex items-center justify-between mb-2"><span className="font-bold flex items-center gap-2"><Rocket size={17} style={{ color: C.gold }} />Desafio {def.t}</span><span className="text-sm font-semibold" style={{ color: C.gold }}>{done}/{def.days}</span></div>
      <div className="h-2 rounded-full overflow-hidden mb-3" style={{ background: C.cardL }}><div className="h-full rounded-full" style={{ width: `${pct}%`, background: C.gold }} /></div>
      {!compact && <div className="flex flex-wrap gap-1.5 mb-3">{Array.from({ length: def.days }).map((_, i) => <div key={i} className="rounded" style={{ width: 14, height: 14, background: i < done ? C.gold : C.cardL }} />)}</div>}
      <div className="flex gap-2"><button onClick={mark} disabled={todayDone} className="flex-1 rounded-xl py-2.5 text-sm font-bold flex items-center justify-center gap-1.5" style={{ background: todayDone ? C.cardL : C.gold, color: todayDone ? C.muted : "#000" }}>{todayDone ? <><Check size={15} /> Dia concluído</> : <>Concluir hoje +40 XP</>}</button>{!compact && <button onClick={quit} className="rounded-xl px-3" style={{ background: C.cardL, color: C.muted }}><X size={16} /></button>}</div>
    </Card>
  );
}

function Panel({ title, onBack, children }) { return (<div className="px-5 pt-6"><div className="flex items-center gap-3 mb-5"><button onClick={onBack} className="rounded-xl p-2" style={{ background: C.card }}><ChevronLeft size={18} style={{ color: C.gold }} /></button><h1 className="text-xl font-bold">{title}</h1></div>{children}<div className="h-6" /></div>); }
function Achievements({ s }) { return (<div className="grid grid-cols-2 gap-3">{ACHV.map(a => { const got = s.achievements.includes(a.id); return (<div key={a.id} className="rounded-2xl p-3.5 flex flex-col gap-1.5" style={{ background: a.rare ? "linear-gradient(135deg, rgba(212,175,55,0.14), rgba(20,20,20,1))" : C.card, border: `1px solid ${got ? C.gold : C.border}`, opacity: got ? 1 : 0.4 }}><div className="flex items-center justify-between"><a.icon size={20} style={{ color: got ? C.gold : C.muted }} />{a.rare && <span className="text-[9px] font-bold px-1.5 py-0.5 rounded" style={{ background: "rgba(212,175,55,0.2)", color: C.gold }}>RARA</span>}</div><span className="font-semibold text-sm">{a.name}</span><span className="text-[11px]" style={{ color: C.muted }}>{a.desc}</span></div>); })}</div>); }
function LevelsView({ s }) { const li = levelInfo(s.xp); return (<div className="space-y-3"><Card className="text-center"><p className="text-sm" style={{ color: C.muted }}>Seu nível</p><p className="text-4xl font-bold" style={{ color: C.gold }}>{li.level}<span className="text-lg" style={{ color: C.muted }}>/100</span></p><div className="h-2 rounded-full overflow-hidden mt-3" style={{ background: C.cardL }}><div className="h-full rounded-full" style={{ width: `${li.pct}%`, background: C.gold }} /></div><p className="text-xs mt-2" style={{ color: C.muted }}>{li.current}/{li.need} XP para o próximo</p></Card><div className="space-y-2">{LEVEL_REWARDS.map(r => { const got = li.level >= r.lvl; return (<div key={r.lvl} className="flex items-center gap-3 rounded-2xl px-4 py-3" style={{ background: C.card, border: `1px solid ${got ? C.gold : C.border}`, opacity: got ? 1 : 0.55 }}><div className="rounded-lg p-2" style={{ background: got ? "rgba(212,175,55,0.15)" : C.cardL }}>{got ? <r.icon size={18} style={{ color: C.gold }} /> : <Lock size={18} style={{ color: C.muted }} />}</div><div className="flex-1"><p className="font-semibold text-sm">{r.t}</p><p className="text-xs" style={{ color: C.muted }}>Nível {r.lvl}</p></div>{got && <Check size={16} style={{ color: C.gold }} />}</div>); })}</div></div>); }
function ChallengesView({ s, update }) { const start = (k) => update({ challenge: { k, start: today(), done: [] } }); return (<div className="space-y-3">{s.challenge && <ChallengeCard s={s} update={update} />}{!s.challenge && CHALLENGES.map(c => (<button key={c.k} onClick={() => start(c.k)} className="w-full text-left rounded-2xl p-4" style={{ background: C.card, border: `1px solid ${C.border}` }}><div className="flex items-center justify-between mb-1"><span className="font-bold flex items-center gap-2"><Rocket size={17} style={{ color: C.gold }} />{c.t}</span><span className="text-xs px-2 py-0.5 rounded-full" style={{ background: "rgba(212,175,55,0.15)", color: C.gold }}>{c.days} dias</span></div><p className="text-sm" style={{ color: C.muted }}>{c.desc}</p></button>))}{s.challenge && <p className="text-xs text-center" style={{ color: C.muted }}>Conclua o desafio atual para iniciar outro.</p>}</div>); }
function LibraryView({ s, fireToast }) { const cats = Object.keys(LIBRARY); const [cat, setCat] = useState(cats[0]); const li = levelInfo(s.xp); return (<div><div className="flex gap-2 overflow-x-auto pb-3">{cats.map(c => <button key={c} onClick={() => setCat(c)} className="px-3.5 py-2 rounded-full whitespace-nowrap text-sm font-semibold" style={{ background: cat === c ? C.gold : C.card, color: cat === c ? "#000" : C.white, border: `1px solid ${cat === c ? C.gold : C.border}` }}>{c}</button>)}</div><div className="space-y-2.5">{LIBRARY[cat].map((it, i) => { const locked = li.level < it.lvl; return (<button key={i} onClick={() => fireToast(locked ? `🔒 Desbloqueia no nível ${it.lvl}` : "▶ Conteúdo em breve")} className="w-full flex items-center gap-3 rounded-2xl px-4 py-3.5" style={{ background: C.card, border: `1px solid ${C.border}`, opacity: locked ? 0.55 : 1 }}><div className="rounded-lg p-2" style={{ background: "rgba(212,175,55,0.12)" }}>{locked ? <Lock size={16} style={{ color: C.muted }} /> : <BookOpen size={16} style={{ color: C.gold }} />}</div><div className="flex-1 text-left"><p className="font-semibold text-sm">{it.t}</p><p className="text-xs" style={{ color: C.muted }}>{locked ? `Nível ${it.lvl}` : it.d}</p></div>{!locked && <ChevronRight size={16} style={{ color: C.muted }} />}</button>); })}</div></div>); }
function ReferralView({ s, fireToast }) { const code = "VIVON-" + (s.profile.name || "VOCE").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 6); const copy = () => { try { navigator.clipboard.writeText(code); fireToast("Código copiado!"); } catch { fireToast(code); } }; const tiers = [{ n: 1, r: "7 dias grátis", icon: Star }, { n: 3, r: "1 mês grátis", icon: Medal }, { n: 5, r: "Tema exclusivo Ouro", icon: Crown }]; return (<div className="space-y-4"><Card className="text-center" style={{ background: "linear-gradient(135deg, rgba(212,175,55,0.12), rgba(20,20,20,1))" }}><Gift size={28} style={{ color: C.gold }} className="mx-auto mb-2" /><p className="text-sm" style={{ color: C.muted }}>Seu código de indicação</p><p className="text-2xl font-bold tracking-wider my-2" style={{ color: C.gold }}>{code}</p><button onClick={copy} className="rounded-xl px-5 py-2.5 text-sm font-bold inline-flex items-center gap-2" style={{ background: C.gold, color: "#000" }}><Copy size={15} />Copiar código</button></Card><p className="text-sm font-semibold">Cada amigo que assinar te dá:</p><div className="space-y-2.5">{tiers.map(t => (<div key={t.n} className="flex items-center gap-3 rounded-2xl px-4 py-3" style={{ background: C.card, border: `1px solid ${C.border}` }}><div className="rounded-lg p-2" style={{ background: "rgba(212,175,55,0.12)" }}><t.icon size={18} style={{ color: C.gold }} /></div><div className="flex-1"><p className="font-semibold text-sm">{t.r}</p><p className="text-xs" style={{ color: C.muted }}>Com {t.n} {t.n === 1 ? "indicação" : "indicações"}</p></div></div>))}</div><p className="text-xs text-center" style={{ color: C.muted }}>Indicações ativas: 0 · conecte ao backend para rastrear automaticamente.</p></div>); }

function Nav({ tab, setTab }) {
  const items = [
    { k: "home", icon: Home, l: "Início" },
    { k: "track", icon: Zap, l: "Evoluir" },
    { k: "treinos", icon: Dumbbell, l: "Treinos" },
    { k: "dash", icon: BarChart3, l: "Painel" },
    { k: "ai", icon: Brain, l: "IA" },
    { k: "profile", icon: User, l: "Perfil" },
  ];
  return (
    <div className="fixed bottom-0 left-1/2 w-full" style={{ maxWidth: 440, transform: "translateX(-50%)", background: "rgba(10,10,10,0.92)", backdropFilter: "blur(12px)", borderTop: `1px solid ${C.border}` }}>
      <div className="flex items-center justify-around px-1 py-2.5">
        {items.map(it => { const active = tab === it.k; return (<button key={it.k} onClick={() => setTab(it.k)} className="flex flex-col items-center gap-1 px-1 py-1"><it.icon size={20} style={{ color: active ? C.gold : C.muted }} /><span className="text-[9px] font-medium" style={{ color: active ? C.gold : C.muted }}>{it.l}</span></button>); })}
      </div>
    </div>
  );
}

createRoot(document.getElementById("root")).render(<VivonApp />);
  </script>
</body>
</html>
